appId: pl.biegowytrener.app
tags:
  - smoke
  - navigation
---
- launchApp:
    clearState: true
- runFlow: shared/skip-onboarding.yaml

- tapOn: "Forma"
- assertVisible:
    id: "fitness-screen"
- assertVisible: "Stan wytrenowania"

- tapOn: "Biegi"
- assertVisible:
    id: "runs-screen"
- assertVisible: "Aktywności"
- assertVisible: "Brak aktywności.*"

- tapOn: "Statystyki"
- assertVisible:
    id: "stats-screen"
- assertVisible: "Statystyki"

- tapOn: "Ustawienia"
- assertVisible:
    id: "settings-screen"
- assertVisible: "Garmin Connect"

- tapOn: "Dziś"
- assertVisible:
    id: "today-screen"
- assertVisible: "Witaj"
