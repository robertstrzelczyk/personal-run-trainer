appId: pl.biegowytrener.app
tags:
  - stats
---
- launchApp:
    clearState: true
- runFlow: shared/skip-onboarding.yaml

- tapOn: "Statystyki"
- assertVisible:
    id: "stats-screen"
- assertVisible: "Tydzień"
- assertVisible: "Miesiąc"
- assertVisible: "Rok"

- tapOn:
    id: "stats-period-week"
- assertVisible: "Ten tydzień"
- assertVisible: "łącznie we wszystkich sportach"
- assertVisible: "Bieganie"
- assertVisible: "Chodzenie"
- assertVisible: "Kolarstwo"

- tapOn:
    id: "stats-period-month"
- assertVisible: "Ten miesiąc"
- assertVisible: "Porównanie okresów"

- tapOn:
    id: "stats-period-year"
- assertVisible: "Ten rok"
- assertVisible: "Porównanie okresów"
